name: Build and Release PyPicker

on:
  push:
    tags:
      - 'v*'  # Si attiva quando fai il push di un tag tipo v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build PyPicker for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: PyPicker-Linux
            asset_name: PyPicker-Linux-x86_64.zip
          - os: windows-latest
            artifact_name: PyPicker-Windows
            asset_name: PyPicker-Windows-x64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller PyPicker.spec

      - name: Compress Binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} PyPicker config.json

      - name: Compress Binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path PyPicker.exe, ..\config.json -DestinationPath ..\${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
