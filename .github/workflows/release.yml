name: Build and Release PyPicker

on:
  push:
    tags:
      - 'v*'  # Si attiva quando fai il push di un tag tipo v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build PyPicker for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller PyPicker.spec

      - name: Build Linux Packages (Zip, DEB, RPM, Arch)
        if: runner.os == 'Linux'
        run: |
          # Extract version from tag (e.g. v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF_NAME#v}
          
          # Install FPM, RPM tools, and bsdtar/zstd for Arch pacman packages
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install --no-document fpm

          # Prepare system package layout (/usr/bin/pypicker)
          mkdir -p pkg_dir/usr/bin
          cp dist/PyPicker pkg_dir/usr/bin/pypicker
          chmod +x pkg_dir/usr/bin/pypicker

          # 1. Generic ZIP
          cd dist
          zip -r ../PyPicker-Linux-x86_64.zip PyPicker
          cd ..

          # 2. Debian / Ubuntu (.deb)
          fpm -s dir -t deb \
            -n pypicker \
            -v "$VERSION" \
            --description "PyPicker - Seismic Waveform Picker" \
            -C pkg_dir .
          mv pypicker_${VERSION}_amd64.deb pypicker-${VERSION}-debian-ubuntu.deb || true

          # 3. Fedora / RHEL (.rpm)
          fpm -s dir -t rpm \
            -n pypicker \
            -v "$VERSION" \
            --description "PyPicker - Seismic Waveform Picker" \
            -C pkg_dir .
          mv pypicker-${VERSION}-1.x86_64.rpm pypicker-${VERSION}-fedora-rhel.rpm || true

          # 4. Arch Linux / Manjaro (.pkg.tar.zst)
          fpm -s dir -t pacman \
            -n pypicker \
            -v "$VERSION" \
            --description "PyPicker - Seismic Waveform Picker" \
            -C pkg_dir .
          mv pypicker-${VERSION}-1-x86_64.pkg.tar.zst pypicker-${VERSION}-archlinux.pkg.tar.zst || true

      - name: Build Windows Package
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path PyPicker.exe -DestinationPath ..\PyPicker-Windows-x64.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PyPicker-Linux-x86_64.zip
            pypicker-*-debian-ubuntu.deb
            pypicker-*-fedora-rhel.rpm
            pypicker-*-archlinux.pkg.tar.zst
            PyPicker-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
